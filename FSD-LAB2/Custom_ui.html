```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodge the Blocks</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: #080a10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        input {
            display: none;
        }

        .game {
            width: 420px;
            height: 650px;
            background: #11141d;
            border: 2px solid #333;
            border-radius: 20px;
            overflow: hidden;
        }

        .game-header {
            height: 60px;
            background: #181c27;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            color: white;
        }

        .game-header h1 {
            color: #00f0ff;
            font-size: 18px;
        }

        .score-box {
            background: #0d111a;
            color: #00f0ff;
            border: 1px solid #00f0ff;
            padding: 7px 12px;
            border-radius: 8px;
        }

        .road {
            height: 500px;
            background: #181920;
            position: relative;
            overflow: hidden;
            border-left: 10px solid #ff0055;
            border-right: 10px solid #ff0055;
        }

        .lane-divider {
            position: absolute;
            top: 0;
            width: 5px;
            height: 100%;
            background: transparent;
        }

        .lane-divider-1 {
            left: 33%;
        }

        .lane-divider-2 {
            left: 66%;
        }

        .line {
            width: 5px;
            height: 70px;
            background: #777;
            position: absolute;
            left: 0;
            animation: roadMove 1s linear infinite;
        }

        .line-1 {
            top: -100px;
        }

        .line-2 {
            top: 100px;
        }

        .line-3 {
            top: 300px;
        }

        .line-4 {
            top: 500px;
        }

        @keyframes roadMove {
            from {
                transform: translateY(-100px);
            }

            to {
                transform: translateY(500px);
            }
        }

        .block {
            width: 52px;
            height: 78px;
            position: absolute;
            top: -100px;
            border-radius: 10px;
        }

        .block::after {
            content: "";
            position: absolute;
            bottom: 7px;
            left: 7px;
            width: 38px;
            height: 8px;
            background: #ff0055;
            border-radius: 3px;
        }

        .block1 {
            left: 15%;
            background: #ff416c;
            animation: fall1 3s linear infinite;
        }

        .block2 {
            left: 50%;
            background: #f7a623;
            animation: fall2 3.5s linear infinite;
            animation-delay: 1s;
        }

        .block3 {
            left: 85%;
            background: #7137d8;
            animation: fall3 3.2s linear infinite;
            animation-delay: 2s;
        }

        @keyframes fall1 {
            from {
                top: -100px;
            }

            to {
                top: 100%;
            }
        }

        @keyframes fall2 {
            from {
                top: -100px;
            }

            to {
                top: 100%;
            }
        }

        @keyframes fall3 {
            from {
                top: -100px;
            }

            to {
                top: 100%;
            }
        }

        .player {
            width: 52px;
            height: 82px;
            background: #00aaff;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            border: 2px solid white;
            border-radius: 10px;
            transition: left 0.3s;
        }

        #lane-left:checked ~ .game .player {
            left: 15%;
        }

        #lane-center:checked ~ .game .player {
            left: 50%;
        }

        #lane-right:checked ~ .game .player {
            left: 85%;
        }

        .window {
            width: 36px;
            height: 24px;
            background: #091322;
            position: absolute;
            top: 18px;
            left: 6px;
            border-radius: 5px;
        }

        .wheel {
            width: 8px;
            height: 18px;
            background: #050505;
            position: absolute;
            border-radius: 3px;
        }

        .wheel-tl {
            left: -6px;
            top: 12px;
        }

        .wheel-tr {
            right: -6px;
            top: 12px;
        }

        .wheel-bl {
            left: -6px;
            bottom: 12px;
        }

        .wheel-br {
            right: -6px;
            bottom: 12px;
        }

        .controls {
            height: 60px;
            background: #181c27;
            display: flex;
            gap: 8px;
            padding: 10px 15px;
        }

        .btn-control {
            flex: 1;
            background: #0f131d;
            color: white;
            border: 1px solid #444;
            border-radius: 8px;
            text-align: center;
            padding: 10px;
            cursor: pointer;
        }

        .btn-control:hover {
            background: #00f0ff;
            color: black;
        }

        #lane-left:checked ~ .game label[for="lane-left"],
        #lane-center:checked ~ .game label[for="lane-center"],
        #lane-right:checked ~ .game label[for="lane-right"] {
            background: #00f0ff;
            color: black;
        }

        .instructions {
            height: 30px;
            background: #181c27;
            color: #777;
            text-align: center;
            font-size: 11px;
            padding: 7px;
        }

    </style>
</head>

<body>

    <input type="radio" name="lane" id="lane-left">

    <div class="game">

        <div class="game-header">
            <h1>DODGE BLOCKS</h1>

        </div>

        <div class="road">

            <div class="lane-divider lane-divider-1">
                <div class="line line-1"></div>

            </div>

            <div class="lane-divider lane-divider-2">
                <div class="line line-1"></div>
                <div class="line line-2"></div>
                <div class="line line-3"></div>
                <div class="line line-4"></div>
            </div>

            <div class="block block1"></div>
            <div class="block block2"></div>
            <div class="block block3"></div>

            <div class="player">

                <div class="window"></div>

                <div class="wheel wheel-tl"></div>

            </div>

                LEFT

                CENTER
            </label>

            <label for="lane-right" class="btn-control">

            </label>

        </div>

    </div>

</body>
</html>
