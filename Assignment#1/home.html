<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnecFriend - Home Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="home.html"><i class="bi bi-share-fill me-2"></i>Connec<span>Friend</span></a>
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse"
                data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto ms-3 mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="home.html"><i
                                class="bi bi-house-door me-1"></i>Home Feed</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html"><i class="bi bi-person me-1"></i>My
                            Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="invitations.html"><i
                                class="bi bi-person-plus me-1"></i>Invitations & Ratings</a></li>
                    <li class="nav-item"><a class="nav-link" href="messages.html"><i
                                class="bi bi-chat-text me-1"></i>Messages</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span id="navUserName" class="text-white fw-bold me-3"></span>
                    <button onclick="logout()" class="btn btn-yellow btn-sm"><i
                            class="bi bi-box-arrow-right me-1"></i>Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">

            <!-- Left Column: Order of Login Sidebar -->
            <div class="col-lg-4 col-md-5 mb-4">
                <div class="cf-card">
                    <div class="cf-card-header">
                        <i class="bi bi-clock-history me-2"></i>Friends (Sorted by Recent Login)
                    </div>
                    <div class="p-3">
                        <p class="small text-muted mb-3">Friends ordered by their latest login time:</p>
                        <ul id="friendsLoginList" class="list-group list-group-flush">
                            <!-- Dynamically populated -->
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Right Column: Share News & News Feed -->
            <div class="col-lg-8 col-md-7">

                <!-- Post Creation Widget -->
                <div class="cf-card">
                    <div class="cf-card-header">
                        <i class="bi bi-pencil-square me-2"></i>Share News with Friends
                    </div>
                    <div class="p-3">
                        <textarea id="postContent" class="form-control mb-3" rows="3"
                            placeholder="What's happening? Share news with your network..."></textarea>

                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                            <div>
                                <label class="fw-bold small text-muted me-2">Share With:</label>
                                <select id="shareAudienceSelect"
                                    class="form-select form-select-sm d-inline-block w-auto"
                                    onchange="toggleSpecificFriendsSelector()">
                                    <option value="all">All Friends</option>
                                    <option value="some">Specific Friends Only...</option>
                                </select>
                            </div>

                            <button onclick="publishPost()" class="btn btn-olive"><i class="bi bi-send me-1"></i>Post
                                News</button>
                        </div>

                        <!-- Specific Friends Selection Checklist (Hidden by default) -->
                        <div id="specificFriendsBox" class="mt-3 p-2 border rounded bg-light d-none">
                            <span class="small fw-bold d-block mb-1">Select Friends to Share With:</span>
                            <div id="friendsCheckboxes" class="d-flex flex-wrap gap-3 small">
                                <!-- Checkboxes populated by JS -->
                            </div>
                        </div>

                    </div>
                </div>

                <!-- News Feed Heading -->
                <h5 class="fw-bold mb-3 text-secondary"><i class="bi bi-newspaper me-2"></i>News Feed</h5>

                <!-- News Feed Container -->
                <div id="newsFeedContainer">
                    <!-- Dynamically populated posts -->
                </div>

            </div>

        </div>
    </div>

    <footer>
        <div class="container small">
            &copy; 2026 ConnecFriend Network — Distinctive Olive & Gold Dashboard Layout
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/home.js"></script>
</body>

</html>
