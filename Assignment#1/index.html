<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnecFriend - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="d-flex flex-column justify-content-between min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-share-fill me-2"></i>Connec<span>Friend</span></a>
        </div>
    </nav>

    <div class="container">
        <div class="login-wrapper">
            <div class="login-header">
                <h3 class="fw-bold mb-1"><i class="bi bi-person-lock me-2"></i>Sign In</h3>
                <p class="small text-warning mb-0">Welcome back to your unique friend network</p>
            </div>
            <div class="card p-4 rounded-0 rounded-bottom shadow-sm">
                <div id="errorAlert" class="alert alert-danger d-none py-2" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold small text-muted">USERNAME</label>
                        <input type="text" id="username" class="form-control"
                            placeholder="Enter 'alex', 'sarah', or 'john'" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold small text-muted">PASSWORD</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter '123'" required>
                    </div>
                    <button type="submit" class="btn btn-olive w-100 py-2 mt-2">Sign In <i
                            class="bi bi-box-arrow-in-right ms-1"></i></button>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <p class="small text-muted mb-1">Demo Accounts (Password: <strong>123</strong>):</p>
                    <span class="badge badge-olive me-1">alex</span>
                    <span class="badge badge-olive me-1">sarah</span>
                    <span class="badge badge-olive">john</span>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container small">
            &copy; 2026 ConnecFriend Network — Designed with Bootstrap & Custom Olive Accent Theme
        </div>
    </footer>

    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
