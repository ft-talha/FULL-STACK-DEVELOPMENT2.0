<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnecFriend - User Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="home.html"><i class="bi bi-share-fill me-2"></i>Connec<span>Friend</span></a>
      <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav me-auto ms-3 mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="home.html"><i class="bi bi-house-door me-1"></i>Home Feed</a></li>
          <li class="nav-item"><a class="nav-link active" href="profile.html"><i class="bi bi-person me-1"></i>My Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="invitations.html"><i class="bi bi-person-plus me-1"></i>Invitations & Ratings</a></li>
          <li class="nav-item"><a class="nav-link" href="messages.html"><i class="bi bi-chat-text me-1"></i>Messages</a></li>
        </ul>
        <div class="d-flex align-items-center">
          <span id="navUserName" class="text-white fw-bold me-3"></span>
          <button onclick="logout()" class="btn btn-yellow btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    
    <!-- User Profile Header Card -->
    <div class="cf-card p-4">
      <div class="row align-items-center">
        <div class="col-auto text-center">
          <img id="profileAvatar" src="" class="avatar-lg mb-2" alt="Profile Picture">
        </div>
        <div class="col">
          <h3 id="profileName" class="fw-bold mb-1">---</h3>
          <p class="text-muted small mb-2"><i class="bi bi-at"></i><span id="profileUsername">---</span></p>
          <div class="bg-light p-3 rounded border">
            <label class="fw-bold small text-muted d-block mb-1">PERSONAL BIO[cite: 1]</label>
            <p id="profileBioDisplay" class="mb-2 fs-6">No bio added yet.</p>
            
            <div id="bioEditBox" class="d-none">
              <textarea id="bioInput" class="form-control mb-2" rows="2"></textarea>
              <button onclick="saveBio()" class="btn btn-olive btn-sm me-2"><i class="bi bi-check-circle me-1"></i>Save Bio</button>
              <button onclick="toggleBioEdit(false)" class="btn btn-secondary btn-sm">Cancel</button>
            </div>
            
            <button id="editBioBtn" onclick="toggleBioEdit(true)" class="btn btn-outline-olive btn-sm"><i class="bi bi-pencil me-1"></i>Edit Bio</button>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <!-- Left Column: Friends List -->
      <div class="col-md-5">
        <div class="cf-card">
          <div class="cf-card-header">
            <i class="bi bi-people-fill me-2"></i>My Friends List[cite: 1]
          </div>
          <div class="p-3">
            <ul id="profileFriendsList" class="list-group list-group-flush">
              <!-- Dynamically populated -->
            </ul>
          </div>
        </div>
      </div>

      <!-- Right Column: Personal Activity Feed -->
      <div class="col-md-7">
        <div class="cf-card">
          <div class="cf-card-header">
            <i class="bi bi-collection-fill me-2"></i>My Posts Feed[cite: 1]
          </div>
          <div class="p-3" id="myPostsContainer">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>
    </div>

  </div>

  <footer>
    <div class="container small">
      &copy; 2026 ConnecFriend Network — Profile & Personal Connections Management
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
