<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnecFriend - Private Messages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="home.html"><i class="bi bi-share-fill me-2"></i>Connec<span>Friend</span></a>
      <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav me-auto ms-3 mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="home.html"><i class="bi bi-house-door me-1"></i>Home Feed</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html"><i class="bi bi-person me-1"></i>My Profile</a></li>
          <li class="nav-item"><a class="nav-link" href="invitations.html"><i class="bi bi-person-plus me-1"></i>Invitations & Ratings</a></li>
          <li class="nav-item"><a class="nav-link active" href="messages.html"><i class="bi bi-chat-text me-1"></i>Messages</a></li>
        </ul>
        <div class="d-flex align-items-center">
          <span id="navUserName" class="text-white fw-bold me-3"></span>
          <button onclick="logout()" class="btn btn-yellow btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="cf-card">
      <div class="row g-0">
        
        <!-- Member Selection List (Friends & Non-Friends) -->
        <div class="col-md-4 border-end">
          <div class="cf-card-header rounded-0">
            <i class="bi bi-people me-2"></i>All Members (Friends & Non-Friends)[cite: 2]
          </div>
          <div class="p-2" style="max-height: 500px; overflow-y: auto;">
            <ul id="membersChatList" class="list-group list-group-flush">
              <!-- Dynamically populated -->
            </ul>
          </div>
        </div>

        <!-- Chat Area -->
        <div class="col-md-8 d-flex flex-column">
          <div class="cf-card-header rounded-0 d-flex align-items-center">
            <i class="bi bi-chat-dots-fill me-2"></i>Chatting with: <strong id="activeChatPartnerName" class="ms-1 text-dark">Select a member</strong>
          </div>

          <div class="p-3 flex-grow-1">
            <div id="chatBox" class="chat-box mb-3 d-flex flex-column gap-2">
              <div class="text-center text-muted my-auto small">Select any member on the left to start private messaging.[cite: 2]</div>
            </div>

            <div class="input-group">
              <input type="text" id="messageInput" class="form-control" placeholder="Type a private message..." disabled>
              <button id="sendMsgBtn" onclick="sendMessage()" class="btn btn-olive" disabled><i class="bi bi-send-fill me-1"></i>Send</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <footer>
    <div class="container small">
      &copy; 2026 ConnecFriend Network — Private Messaging & Direct Communication Hub
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
