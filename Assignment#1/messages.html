<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectFriend | Private Messages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        teal: {
                            50: '#e6f5f5', 100: '#a8e0df', 200: '#7ed0ce',
                            300: '#4db8b8', 400: '#2d8a8c', 500: '#1a5c5e',
                            600: '#155050', 700: '#0f3d3e', 800: '#0a2c2d', 900: '#061e1f'
                        },
                        amber: {
                            50: '#fef3c7', 400: '#f59e0b', 500: '#d97706', 700: '#b45309'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
</head>

<body class="pb-8">

    <!-- Navigation -->
    <nav class="sticky top-0 z-40 glass-nav mb-6">
        <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <a href="home.html" class="flex items-center gap-3">
                <div
                    class="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-700 to-teal-400 flex items-center justify-center font-extrabold text-white shadow-md">
                    CF
                </div>
                <span class="font-extrabold text-xl tracking-tight text-teal-900">ConnectFriend</span>
            </a>

            <div
                class="flex items-center gap-1 sm:gap-1.5 bg-white/70 p-1.5 rounded-2xl border border-gray-200/80 text-xs shadow-sm">
                <a href="home.html"
                    class="px-3.5 py-2 rounded-xl font-semibold text-gray-600 hover:text-gray-900 transition-all">Home</a>
                <a href="invitations.html"
                    class="px-3.5 py-2 rounded-xl font-semibold text-gray-600 hover:text-gray-900 transition-all">Invitations</a>
                <a href="messages.html"
                    class="px-3.5 py-2 rounded-xl font-bold bg-teal-900 text-white shadow-sm">Messages</a>
                <a href="profile.html"
                    class="px-3.5 py-2 rounded-xl font-semibold text-gray-600 hover:text-gray-900 transition-all">Profile</a>
            </div>

            <button onclick="logoutUser()"
                class="px-3.5 py-2 rounded-xl text-xs font-bold text-red-600 hover:bg-red-50 border border-red-200 transition-all">
                Logout
            </button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4">
        <div class="glass-panel rounded-[32px] overflow-hidden shadow-2xl animate-slide-up
                    grid grid-cols-1 md:grid-cols-12
                    h-[calc(100vh-140px)] min-h-[500px]">

            <!-- Left Sidebar: Conversations list -->
            <aside class="md:col-span-4 border-r border-gray-200 bg-white/40 p-4 flex flex-col overflow-hidden">
                <h3 class="font-extrabold text-xs uppercase tracking-wider text-gray-800 mb-3 px-2">Conversations</h3>
                <div id="chat-friends-list" class="space-y-2 overflow-y-auto flex-1">
                    <!-- Dynamically populated -->
                </div>
            </aside>

            <!-- Right Area: Chat Window -->
            <section class="md:col-span-8 flex flex-col overflow-hidden bg-white/60">

                <!-- Active Chat Header -->
                <div class="p-4 border-b border-gray-200 flex items-center gap-3 bg-white/80">
                    <img id="active-chat-avatar" class="w-10 h-10 rounded-xl object-cover border border-gray-200"
                        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150" alt="">
                    <div>
                        <h4 id="active-chat-name" class="font-bold text-sm text-gray-900">Select a Friend</h4>
                        <span id="active-chat-status" class="text-[11px] text-teal-600 font-semibold">Online</span>
                    </div>
                </div>

                <!-- Chat Bubble Thread -->
                <div id="chat-messages-container" class="flex-1 p-4 overflow-y-auto space-y-3 bg-teal-50/30">
                    <!-- Rendered messages -->
                </div>

                <!-- Message Composer -->
                <form onsubmit="sendMessage(event)"
                    class="p-4 border-t border-gray-200 bg-white/80 flex items-center gap-2">
                    <input type="text" id="message-input" placeholder="Type a private message..."
                        class="flex-1 px-4 py-3 rounded-2xl border border-gray-200 text-sm focus:outline-none bg-gray-50">
                    <button type="submit"
                        class="px-6 py-3 rounded-2xl btn-primary-gradient text-white text-xs font-bold uppercase tracking-wider">
                        Send
                    </button>
                </form>

            </section>

        </div>
    </main>

    <div id="toast-notification"
        class="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3.5 rounded-2xl bg-teal-800 text-white shadow-2xl transition-all duration-300 opacity-0 pointer-events-none translate-y-4 border border-teal-500/40">
        <span id="toast-text" class="text-xs font-bold">Notification message</span>
    </div>

    <script src="js/common.js"></script>
    <script src="js/messages.js"></script>
</body>

</html>
