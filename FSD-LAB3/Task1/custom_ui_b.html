<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodge the Blocks — Bootstrap 5 Arcade Edition</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Pure CSS Lane Control Logic */
        #lane-left, #lane-center, #lane-right {
            display: none;
        }

        #lane-left:checked ~ .container-fluid .player {
            left: 15%;
            transform: translateX(-50%) rotate(-6deg);
        }

        #lane-center:checked ~ .container-fluid .player {
            left: 50%;
            transform: translateX(-50%) rotate(0deg);
        }

        #lane-right:checked ~ .container-fluid .player {
            left: 85%;
            transform: translateX(-50%) rotate(6deg);
        }

        /* Active Bootstrap Button Highlighting */
        #lane-left:checked ~ .container-fluid label[for="lane-left"],
        #lane-center:checked ~ .container-fluid label[for="lane-center"],
        #lane-right:checked ~ .container-fluid label[for="lane-right"] {
            background-color: #00f0ff !important;
            color: #000 !important;
            box-shadow: 0 0 15px #00f0ff;
            border-color: #00f0ff !important;
        }

        /* Game Container Custom Adjustments */
        .game-card {
            max-width: 420px;
            height: min(650px, 94vh);
            background-color: #11141d !important;
            border: 2px solid #23293a !important;
        }

        /* Road Surface */
        .road-surface {
            background-color: #181920 !important;
            border-left: 10px solid #ff0055;
            border-right: 10px solid #ff0055;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
        }

        /* Road Divider Lines */
        .lane-divider {
            position: absolute;
            width: 6px;
            height: 100%;
            top: 0;
        }

        .lane-divider-1 { left: 33.33%; }
        .lane-divider-2 { left: 66.66%; }

        .line {
            position: absolute;
            width: 6px;
            height: 70px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            animation: roadMove 0.8s linear infinite;
        }

        .line-1 { top: -100px; }
        .line-2 { top: 100px; }
        .line-3 { top: 300px; }
        .line-4 { top: 500px; }

        @keyframes roadMove {
            0% { transform: translateY(-200px); }
            100% { transform: translateY(400px); }
        }

        /* Obstacles */
        .block {
            width: 52px;
            height: 78px;
            border-radius: 10px;
            position: absolute;
            top: -120px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            z-index: 5;
        }

        .block::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 6px;
            right: 6px;
            height: 8px;
            background: #ff0055;
            border-radius: 3px;
            box-shadow: 0 0 8px #ff0055;
        }

        .block1 {
            left: 15%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #ff416c, #ff4b2b);
            animation: fall 2.8s linear infinite;
        }

        .block2 {
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #f7b733, #fc4a1a);
            animation: fall 3.6s linear infinite 0.9s;
        }

        .block3 {
            left: 85%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #8e2de2, #4a00e0);
            animation: fall 3.1s linear infinite 1.8s;
        }

        @keyframes fall {
            0% { top: -120px; }
            100% { top: 108%; }
        }

        /* Player Car */
        .player {
            width: 52px;
            height: 82px;
            background: linear-gradient(180deg, #00f0ff, #0072ff);
            border-radius: 10px;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            border: 2px solid #ffffff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transition: left 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.25s ease;
            z-index: 10;
        }

        .window {
            width: 36px;
            height: 24px;
            background: #091322;
            position: absolute;
            top: 18px;
            left: 6px;
            border-radius: 5px;
            border: 1px solid rgba(0, 240, 255, 0.5);
        }

        .headlights {
            position: absolute;
            top: -30px;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(0deg, rgba(0,240,255,0.4) 0%, rgba(0,240,255,0) 100%);
            clip-path: polygon(10% 100%, 0% 0%, 100% 0%, 90% 100%);
        }

        .wheel {
            width: 8px;
            height: 18px;
            background: #05070a;
            position: absolute;
            border-radius: 3px;
            border: 1px solid #333;
        }

        .wheel-tl { left: -6px; top: 12px; }
        .wheel-tr { right: -6px; top: 12px; }
        .wheel-bl { left: -6px; bottom: 12px; }
        .wheel-br { right: -6px; bottom: 12px; }

        .title-gradient {
            background: linear-gradient(45deg, #00f0ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="bg-dark user-select-none">

    <!-- Pure CSS Lane Radio Controls -->
    <input type="radio" name="lane" id="lane-left">
    <input type="radio" name="lane" id="lane-center" checked>
    <input type="radio" name="lane" id="lane-right">

    <div class="container-fluid vh-100 d-flex justify-content-center align-items-center p-2">
        
        <div class="card game-card w-100 rounded-4 shadow-lg overflow-hidden d-flex flex-column">

            <!-- HUD Header -->
            <div class="card-header bg-dark border-bottom border-secondary d-flex justify-content-between align-items-center py-2 px-3">
                <h1 class="h6 mb-0 fw-bold text-uppercase tracking-wider title-gradient">DODGE BLOCKS</h1>
                <span class="badge bg-black border border-info text-info font-monospace fs-6 px-3 py-2">SCORE: 1,280</span>
            </div>

            <!-- Road Canvas -->
            <div class="card-body p-0 position-relative overflow-hidden flex-grow-1 road-surface">

                <!-- Lane Dividers -->
                <div class="lane-divider lane-divider-1">
                    <div class="line line-1"></div>
                    <div class="line line-2"></div>
                    <div class="line line-3"></div>
                    <div class="line line-4"></div>
                </div>

                <div class="lane-divider lane-divider-2">
                    <div class="line line-1"></div>
                    <div class="line line-2"></div>
                    <div class="line line-3"></div>
                    <div class="line line-4"></div>
                </div>

                <!-- Obstacles -->
                <div class="block block1"></div>
                <div class="block block2"></div>
                <div class="block block3"></div>

                <!-- Player Vehicle -->
                <div class="player">
                    <div class="headlights"></div>
                    <div class="window"></div>
                    <div class="wheel wheel-tl"></div>
                    <div class="wheel wheel-tr"></div>
                    <div class="wheel wheel-bl"></div>
                    <div class="wheel wheel-br"></div>
                </div>

            </div>

            <!-- Bootstrap Button Controls -->
            <div class="card-footer bg-dark border-top border-secondary p-3">
                <div class="btn-group w-100" role="group">
                    <label for="lane-left" class="btn btn-outline-info text-uppercase fw-bold text-truncate py-2">◀ LEFT</label>
                    <label for="lane-center" class="btn btn-outline-info text-uppercase fw-bold text-truncate py-2">▲ CENTER</label>
                    <label for="lane-right" class="btn btn-outline-info text-uppercase fw-bold text-truncate py-2">RIGHT ▶</label>
                </div>
                <div class="text-center text-secondary small mt-2">
                    Click buttons or tap lanes to steer
                </div>
            </div>

        </div>

    </div>

</body>

</html>
