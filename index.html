<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Stack Development - Main Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        p {
            margin-bottom: 25px;
            color: #7f8c8d;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }
        .nav-btn {
            display: block;
            padding: 15px 20px;
            background-color: #0984e3;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
        }
        .nav-btn:hover {
            background-color: #0769b5;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Full Stack Development Labs</h1>
        <p>Select a lab to navigate to its index page:</p>

        <div class="nav-grid">
            <!-- Relative paths configured for your folder structure -->
            <a href="./FSD-LAB1/index.html" class="nav-btn">FSD Lab 1</a>
            <a href="./FSD-LAB2/index.html" class="nav-btn">FSD Lab 2</a>
            <a href="./FSD-LAB3/index.html" class="nav-btn">FSD Lab 3</a>
        </div>
    </div>

</body>
</html>
